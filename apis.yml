aid: dehaze
name: dehaze
description: >-
  dehaze is a Munich-area (Fürstenfeldbruck, Germany) healthtech company, part of
  the Techstars Berlin cohort, building proprietary causal AI infrastructure that
  detects chronic and autoimmune disease earlier by identifying overlooked
  diagnoses, health risks, and inappropriate treatments. Its platform unifies and
  harmonizes diverse health data (lab results, medical imaging, genomics, clinical
  notes) into doctor-validated patient journeys, risk-profiles individuals against
  millions of health journeys and medical guidelines, and runs targeted AI
  follow-ups to improve treatment adherence for patients, payers, and providers.
  dehaze has analyzed over 250,000 patient lives across 300 million health events
  and 200+ AI algorithms, and raised €3.2M in 2026. dehaze publishes no first-party
  developer API; it exposes a Wix Site MCP endpoint and an llms.txt for agentic AI
  access to public site content.
